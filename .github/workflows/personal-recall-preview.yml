name: Personal recall preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-recall-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ULTRABRAIN_HOME: /home/runner/ultrabrain-task-context-test
      ULTRABRAIN_TEST_ALLOW_WRITE: '1'
      ULTRABRAIN_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Native prerequisites on disposable runner
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev zlib1g-dev pkg-config
      - run: install -d -m 0700 "$ULTRABRAIN_HOME"
      - uses: actions/cache@v4
        with:
          path: /home/runner/ultrabrain-task-context-test/runtime
          key: native-ubuntu24-v1-${{ hashFiles('upstreams.lock.json', 'scripts/build-postgres.sh') }}
      - name: Bootstrap only the disposable managed database
        run: bash scripts/bootstrap-linux.sh
      - name: Isolated browser dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/recall-browser-venv"
          "$RUNNER_TEMP/recall-browser-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/recall-browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Chromium read-only previews, exact-ID corrections and explicit conflict comparison
        env:
          ULTRABRAIN_BROWSER_PYTHON: ${{ runner.temp }}/recall-browser-venv/bin/python
          ULTRABRAIN_BROWSER_REPORT: ${{ runner.temp }}/personal-recall-browser-report.json
          ULTRABRAIN_BROWSER_SCREENSHOT: ${{ runner.temp }}/personal-recall-preview.png
          ULTRABRAIN_LOOKUP_REPORT: ${{ runner.temp }}/personal-memory-lookup-report.json
          ULTRABRAIN_LOOKUP_SCREENSHOT: ${{ runner.temp }}/personal-memory-lookup.png
          ULTRABRAIN_RECEIPT_REPORT: ${{ runner.temp }}/personal-console-receipts-report.json
          ULTRABRAIN_RECEIPT_SCREENSHOT: ${{ runner.temp }}/personal-console-receipts.png
          ULTRABRAIN_DOCUMENT_RECEIPT_REPORT: ${{ runner.temp }}/personal-document-receipts-report.json
          ULTRABRAIN_DOCUMENT_RECEIPT_SCREENSHOT: ${{ runner.temp }}/personal-document-receipts.png
          ULTRABRAIN_DOCUMENT_READ_REPORT: ${{ runner.temp }}/personal-document-read-report.json
          ULTRABRAIN_DOCUMENT_READ_SCREENSHOT: ${{ runner.temp }}/personal-document-read.png
          ULTRABRAIN_COMPARISON_SCREENSHOT: ${{ runner.temp }}/personal-memory-comparison.png
        run: bun test/personal-recall-browser-fixture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: personal-recall-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/personal-recall-browser-report.json
            ${{ runner.temp }}/personal-recall-preview.png
            ${{ runner.temp }}/personal-memory-lookup-report.json
            ${{ runner.temp }}/personal-memory-lookup.png
            ${{ runner.temp }}/personal-memory-comparison.png
            ${{ runner.temp }}/personal-console-receipts-report.json
            ${{ runner.temp }}/personal-console-receipts.png
            ${{ runner.temp }}/personal-document-receipts-report.json
            ${{ runner.temp }}/personal-document-receipts.png
            ${{ runner.temp }}/personal-document-read-report.json
            ${{ runner.temp }}/personal-document-read.png
          if-no-files-found: error
          retention-days: 14
      - name: Stop only the disposable database
        if: always()
        run: bun src/cli.mjs db stop || true
      # No tokens, user tasks, private configs, database dumps or raw service logs uploaded.
