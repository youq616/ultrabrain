name: Task-aware personal recall
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task-context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  task-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ULTRABRAIN_HOME: /home/runner/ultrabrain-task-context-test
      ULTRABRAIN_TEST_ALLOW_WRITE: '1'
      ULTRABRAIN_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev zlib1g-dev pkg-config
      - run: install -d -m 0700 "$ULTRABRAIN_HOME"
      - uses: actions/cache@v4
        with:
          path: /home/runner/ultrabrain-task-context-test/runtime
          key: native-ubuntu24-v1-${{ hashFiles('upstreams.lock.json', 'scripts/build-postgres.sh') }}
      - name: Bootstrap isolated synthetic server
        run: bash scripts/bootstrap-linux.sh
      - name: Build and install this exact client package
        run: |
          ln -s "$GITHUB_WORKSPACE/vendor/gbrain/node_modules" packages/ultrabrain-client/node_modules
          bash scripts/package-client.sh "$RUNNER_TEMP/task-client"
          VERSION="$(node -p "require('./packages/ultrabrain-client/package.json').version")"
          npm install --prefix "$RUNNER_TEMP/task-host" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/task-client/ultrabrain-client-$VERSION.tgz"
      - name: Actual installed Node task/Claude-fixture CLI, stdio/HTTP, PostgreSQL and revocation
        env:
          ULTRABRAIN_TASK_CLIENT_ROOT: ${{ runner.temp }}/task-host/node_modules/ultrabrain-client
        run: bun test/personal-memory-read-integration.mjs && bun test/task-context-integration.mjs && bun test/client-proxy-lifecycle-integration.mjs
      - name: Installed client direct-source verification, no model calls
        env:
          ULTRABRAIN_TASK_CLIENT_ROOT: ${{ runner.temp }}/task-host/node_modules/ultrabrain-client
          ULTRABRAIN_CLIENT_LINEAGE_REPORT: ${{ runner.temp }}/client-lineage-report.json
        run: bun test/client-lineage-integration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: client-lineage-${{ github.sha }}
          path: ${{ runner.temp }}/client-lineage-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Prove offline guard rejects descriptor writes and caught denials
        run: node --test test/snapshot-offline-guard.test.mjs
      - name: Standalone installed snapshot entries under the descriptor guard
        run: node test/client-snapshot-offline-package.mjs "$RUNNER_TEMP/task-host/node_modules/ultrabrain-client"
      - name: Installed offline snapshot toolbox on actual database exports
        env:
          ULTRABRAIN_TASK_CLIENT_ROOT: ${{ runner.temp }}/task-host/node_modules/ultrabrain-client
          ULTRABRAIN_CLIENT_SNAPSHOT_REPORT: ${{ runner.temp }}/client-snapshot-report.json
        run: bun test/client-snapshot-integration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: client-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/client-snapshot-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Offline source audit on real consolidated PostgreSQL exports
        env:
          ULTRABRAIN_TASK_CLIENT_ROOT: ${{ runner.temp }}/task-host/node_modules/ultrabrain-client
          ULTRABRAIN_SNAPSHOT_AUDIT_REPORT: ${{ runner.temp }}/snapshot-audit-report.json
        run: bun test/client-snapshot-audit-integration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-audit-${{ github.sha }}
          path: ${{ runner.temp }}/snapshot-audit-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Bounded source trace on real PostgreSQL fixture exports
        env:
          ULTRABRAIN_TASK_CLIENT_ROOT: ${{ runner.temp }}/task-host/node_modules/ultrabrain-client
          ULTRABRAIN_SNAPSHOT_TRACE_REPORT: ${{ runner.temp }}/snapshot-trace-report.json
        run: bun test/client-snapshot-trace-integration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-trace-${{ github.sha }}
          path: ${{ runner.temp }}/snapshot-trace-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Installed explicit owner overview client, no models
        env:
          ULTRABRAIN_TASK_CLIENT_ROOT: ${{ runner.temp }}/task-host/node_modules/ultrabrain-client
          ULTRABRAIN_CLIENT_OVERVIEW_REPORT: ${{ runner.temp }}/client-overview-report.json
        run: bun test/client-overview-integration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: client-overview-${{ github.sha }}
          path: ${{ runner.temp }}/client-overview-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop only isolated database
        if: always()
        run: bun src/cli.mjs db stop || true
      # No tasks, credentials, raw protocol logs or database dumps uploaded.
