name: Source snapshot
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked application source without credentials or build products
        run: |
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/ultrabrain-source.tgz"
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ultrabrain-source.tgz
            ${{ runner.temp }}/commit.txt
          retention-days: 3
          if-no-files-found: error
