name: Personal client portability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test test/client-kit.test.mjs
      - run: python -m unittest discover -s test -p test_client_config.py -v
