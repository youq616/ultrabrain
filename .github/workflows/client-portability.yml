name: Personal client portability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test test/personal-jobs.test.mjs test/personal-job-manager.test.mjs test/personal-document-receipts.test.mjs test/personal-console-receipts.test.mjs test/personal-memory-compare.test.mjs test/personal-memory-read.test.mjs test/personal-memory-lookup.test.mjs test/client-authorization.test.mjs test/client-profile-authorization.test.mjs test/client-request-authorization.test.mjs test/client-task-context.test.mjs test/client-kit.test.mjs test/personal-documents.test.mjs test/client-document-boundaries.test.mjs test/native-adapters.test.mjs test/capture-outbox.test.mjs test/automatic-capture.test.mjs test/capture-hardening.test.mjs test/capture-delivery.test.mjs test/capture-profile-binding.test.mjs test/client-release-docs.test.mjs
      - run: python -m unittest discover -s test -p test_task_context_config.py -v
      - run: python -m unittest discover -s test -p test_client_config.py -v
      - run: python -m unittest discover -s test -p test_native_adapter_config.py -v
      - run: python -m unittest discover -s test -p test_hermes_provider.py -v
      - run: python -m unittest discover -s test -p test_automatic_capture_config.py -v
