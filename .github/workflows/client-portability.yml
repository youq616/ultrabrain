name: Personal client portability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test test/client-snapshot-trace.test.mjs test/client-snapshot-trace-cli.test.mjs test/client-snapshot-audit.test.mjs test/client-snapshot-audit-cli.test.mjs test/snapshot-offline-guard.test.mjs test/client-snapshot.test.mjs test/client-snapshot-files.test.mjs test/client-snapshot-races.test.mjs test/client-snapshot-cli.test.mjs test/client-snapshot-package.test.mjs test/client-lineage.test.mjs test/client-lineage-runtime.test.mjs test/client-lineage-cli.test.mjs test/personal-lineage.test.mjs test/personal-lineage-ui.test.mjs test/personal-snapshot-explorer.test.mjs test/personal-snapshot-explorer-ui.test.mjs test/personal-snapshot-inspector.test.mjs test/personal-snapshot-inspector-ui.test.mjs test/personal-snapshot.test.mjs test/personal-snapshot-browser.test.mjs test/personal-job-recovery-barrier.test.mjs test/personal-job-recovery.test.mjs test/personal-document-module.test.mjs test/personal-document-read.test.mjs test/personal-jobs.test.mjs test/personal-job-manager.test.mjs test/personal-document-receipts.test.mjs test/personal-console-receipts.test.mjs test/personal-memory-compare.test.mjs test/personal-memory-read.test.mjs test/personal-memory-lookup.test.mjs test/client-authorization.test.mjs test/client-profile-authorization.test.mjs test/client-request-authorization.test.mjs test/client-task-context.test.mjs test/client-kit.test.mjs test/personal-documents.test.mjs test/client-document-boundaries.test.mjs test/native-adapters.test.mjs test/capture-outbox.test.mjs test/automatic-capture.test.mjs test/capture-hardening.test.mjs test/capture-delivery.test.mjs test/capture-profile-binding.test.mjs test/client-release-docs.test.mjs test/client-snapshot-impact.test.mjs test/client-snapshot-impact-boundaries.test.mjs test/client-snapshot-impact-cli.test.mjs test/client-snapshot-navigation.test.mjs test/personal-overview.test.mjs test/personal-overview-ui.test.mjs test/personal-overview-http.test.mjs test/personal-overview-boundaries.test.mjs
      - name: Explicit owner overview client contracts
        run: node --test test/client-overview.test.mjs test/client-overview-runtime.test.mjs test/client-overview-cli.test.mjs test/client-overview-package.test.mjs
      - name: n8n owner overview contracts
        run: node --test test/n8n-overview.test.mjs test/n8n-overview-node.test.mjs
      - name: Offline exact-content duplicate review
        run: node --test test/client-snapshot-duplicates.test.mjs test/client-snapshot-duplicates-boundaries.test.mjs test/client-snapshot-duplicates-cli.test.mjs
      - name: Local snapshot duplicate review UI and shared contract
        run: node --test test/personal-snapshot-duplicates-ui.test.mjs test/personal-snapshot-duplicates-shared.test.mjs
      - run: python -m unittest discover -s test -p test_task_context_config.py -v
      - run: python -m unittest discover -s test -p test_client_config.py -v
      - run: python -m unittest discover -s test -p test_native_adapter_config.py -v
      - run: python -m unittest discover -s test -p test_hermes_provider.py -v
      - run: python -m unittest discover -s test -p test_automatic_capture_config.py -v
