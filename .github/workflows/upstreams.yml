name: Review upstream updates
on:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-review
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [gbrain, openviking, postgres, pgvector]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect one upstream; preserve its report even on partial failure
        id: inspect
        continue-on-error: true
        env:
          PROJECT: ${{ matrix.project }}
        run: python3 scripts/upstreams.py check --project "$PROJECT" > "$RUNNER_TEMP/upstream-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ matrix.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-report.json
          retention-days: 30
      - name: Publish successful candidates AND inspection failures
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/upstream-issue.cjs');
            await publish({github,context,core},process.env.RUNNER_TEMP+'/upstream-report.json');
      - name: Keep failed checks visibly failed, without cancelling other projects
        if: steps.inspect.outcome == 'failure'
        run: exit 1
