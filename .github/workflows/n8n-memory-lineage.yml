name: n8n memory source verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n8n-memory-lineage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-n8n-memory-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ULTRABRAIN_HOME: /home/runner/ultrabrain-n8n-memory-lineage-test
      ULTRABRAIN_TEST_ALLOW_WRITE: '1'
      ULTRABRAIN_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Source verification contracts and separate review probes
        run: node --test test/n8n-memory-lineage.test.mjs test/n8n-memory-lineage-audit.test.mjs
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev zlib1g-dev pkg-config
      - run: install -d -m 0700 "$ULTRABRAIN_HOME"
      - uses: actions/cache@v4
        with:
          path: /home/runner/ultrabrain-n8n-memory-lineage-test/runtime
          key: native-ubuntu24-v1-${{ hashFiles('upstreams.lock.json', 'scripts/build-postgres.sh') }}
      - name: Bootstrap private synthetic database
        run: bash scripts/bootstrap-linux.sh
      - name: Build exact private node package
        run: bash scripts/package-n8n.sh "$RUNNER_TEMP/n8n-memory-lineage-package"
      - name: Install reviewed n8n and this local tgz
        run: |
          npm install --prefix "$RUNNER_TEMP/n8n-memory-lineage-host" --no-audit --no-fund n8n@2.38.7 n8n-workflow@2.38.1 "$RUNNER_TEMP/n8n-memory-lineage-package/n8n-nodes-ultrabrain-0.8.2-alpha.1.tgz"
      - name: Real n8n workflow, official MCP and PostgreSQL
        env:
          ULTRABRAIN_N8N_BIN: ${{ runner.temp }}/n8n-memory-lineage-host/node_modules/n8n/bin/n8n
          ULTRABRAIN_N8N_INSTALLED: ${{ runner.temp }}/n8n-memory-lineage-host/node_modules/n8n-nodes-ultrabrain
          ULTRABRAIN_N8N_LINEAGE_REPORT: ${{ runner.temp }}/n8n-memory-lineage-report.json
        run: bun test/n8n-memory-lineage-integration.mjs --engine
      - uses: actions/upload-artifact@v4
        with:
          name: n8n-memory-lineage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/n8n-memory-lineage-report.json
            ${{ runner.temp }}/n8n-memory-lineage-package/*.tgz
            ${{ runner.temp }}/n8n-memory-lineage-package/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated database
        if: always()
        run: bun src/cli.mjs db stop || true
# No user host deployment, raw execution logs, credentials or database uploads.
