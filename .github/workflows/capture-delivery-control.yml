name: Capture delivery control
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery-control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22.16.0', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pause, explicit CAS resume, native IO, CLI and journal regressions
        shell: bash
        run: node --test test/capture-delivery-control*.test.mjs test/capture-journal*.test.mjs > "$RUNNER_TEMP/capture-delivery-control.tap"
      - name: Twenty-five independent eight-process control races
        shell: bash
        run: node scripts/check-capture-delivery-control.mjs --rounds 25 > "$RUNNER_TEMP/capture-delivery-control.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-control-${{ matrix.os }}-${{ matrix.node }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/capture-delivery-control.tap
            ${{ runner.temp }}/capture-delivery-control.json
          if-no-files-found: warn
          retention-days: 14
