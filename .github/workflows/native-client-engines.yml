name: Native personal integrations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  opencode-and-hermes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ULTRABRAIN_HOME: /home/runner/ultrabrain-native-test
      ULTRABRAIN_TEST_ALLOW_WRITE: '1'
      ULTRABRAIN_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev zlib1g-dev pkg-config
      - run: install -d -m 0700 "$ULTRABRAIN_HOME"
      - uses: actions/cache@v4
        with:
          path: /home/runner/ultrabrain-native-test/runtime
          key: native-ubuntu24-v1-${{ hashFiles('upstreams.lock.json', 'scripts/build-postgres.sh') }}
      - name: Bootstrap isolated native server
        run: bash scripts/bootstrap-linux.sh
      - name: Install exact locally built client package
        run: |
          bash scripts/package-client.sh "$RUNNER_TEMP/native-client"
          npm install --prefix "$RUNNER_TEMP/native-host" --no-audit --no-fund --ignore-scripts "$RUNNER_TEMP/native-client/ultrabrain-client-0.13.0-alpha.1.tgz"
          ln -s "$RUNNER_TEMP/native-host/node_modules" packages/ultrabrain-client/node_modules
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: fadcff92270dec3781b2d6b422d828424c105c67
          path: .validation/hermes-reference
          persist-credentials: false
      - name: Hermes provider against pinned upstream base class (not full agent)
        env:
          ULTRABRAIN_HERMES_REFERENCE: ${{ github.workspace }}/.validation/hermes-reference
        run: python3 -m unittest discover -s test -p test_hermes_provider.py -v
      - name: Install reviewed OpenCode host
        run: npm install --prefix "$RUNNER_TEMP/opencode-host" --no-audit --no-fund opencode-ai@1.18.30
      - name: Actual OpenCode model request and native provider integrations
        env:
          ULTRABRAIN_OPENCODE_BIN: ${{ runner.temp }}/opencode-host/node_modules/.bin/opencode
          ULTRABRAIN_NATIVE_INSTALLED: ${{ runner.temp }}/native-host/node_modules/ultrabrain-client
          ULTRABRAIN_HERMES_REFERENCE: ${{ github.workspace }}/.validation/hermes-reference
        run: bun test/native-adapters-integration.mjs --opencode-engine
      - name: Stop isolated database
        if: always()
        run: bun src/cli.mjs db stop || true
