name: Personal user services
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-services-${{ github.ref }}
  cancel-in-progress: true
jobs:
  user-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ULTRABRAIN_HOME: /home/runner/ultrabrain-personal-services-test
      ULTRABRAIN_TEST_ALLOW_WRITE: '1'
      ULTRABRAIN_SYSTEMD_TEST: '1'
      ULTRABRAIN_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Native and user-manager prerequisites on disposable runner
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev zlib1g-dev pkg-config dbus-user-session python3-dbus
      - run: install -d -m 0700 "$ULTRABRAIN_HOME"
      - uses: actions/cache@v4
        with:
          path: /home/runner/ultrabrain-personal-services-test/runtime
          key: native-ubuntu24-v1-${{ hashFiles('upstreams.lock.json', 'scripts/build-postgres.sh') }}
      - name: Initialize only synthetic installation
        run: bash scripts/bootstrap-linux.sh
      - name: Harden system unit search directories only on this disposable runner
        # The hosted ubuntu24/20260907.300 image makes /usr/share recursively 0777.
        # Keep the production refusal; restore safe directory ancestry in this fixture.
        run: |
          sudo /usr/bin/python3 -I -B - <<'PY'
          import json, os, stat
          flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          parent = os.open('/usr', flags)
          path = '/usr'
          try:
              value = os.fstat(parent)
              assert value.st_uid == 0 and not value.st_mode & 0o022
              for component in ('share', 'systemd', 'user'):
                  path += '/' + component
                  try:
                      child = os.open(component, flags, dir_fd=parent)
                  except FileNotFoundError:
                      print(json.dumps({'runner_directory': path, 'absent': True}))
                      break
                  os.close(parent)
                  parent = child
                  value = os.fstat(parent)
                  assert value.st_uid == 0
                  mode = stat.S_IMODE(value.st_mode) & ~0o022
                  os.fchmod(parent, mode)
                  print(json.dumps({'runner_directory': path, 'mode_before': oct(stat.S_IMODE(value.st_mode)),
                                    'mode_after': oct(stat.S_IMODE(os.fstat(parent).st_mode))}))
          finally:
              os.close(parent)
          PY
      - name: Start runner user manager (not a user production machine)
        # The hosted manager retains permitted capabilities that ordinary test
        # callers lack. Normalize only this disposable manager; keep proc guards.
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import os, pwd, sys
          uid = os.getuid()
          assert sys.platform == 'linux' and 0 < uid == os.geteuid()
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('ULTRABRAIN_TEST_ALLOW_WRITE') == '1'
          assert os.environ.get('ULTRABRAIN_SYSTEMD_TEST') == '1'
          assert pwd.getpwuid(uid).pw_dir == os.environ.get('HOME') == '/home/runner'
          assert os.environ.get('ULTRABRAIN_HOME') == '/home/runner/ultrabrain-personal-services-test'
          unit = ('user@' + str(uid) + '.service').encode()
          fd = os.open('/proc/self/cgroup', os.O_RDONLY | os.O_NOFOLLOW)
          with os.fdopen(fd, 'rb') as stream:
              raw = stream.read(65537)
          assert raw and len(raw) <= 65536
          for line in raw.splitlines():
              fields = line.split(b':', 2)
              assert len(fields) == 3 and fields[0].isdigit() and fields[2].startswith(b'/')
              assert b'\x00' not in fields[2] and unit not in fields[2].split(b'/')
          PY
          fixture_uid="$(/usr/bin/id -u)"
          fixture_unit="user@${fixture_uid}.service"
          sudo /usr/bin/python3 -I -B - "$fixture_uid" <<'PY'
          import os, pwd, stat, sys
          assert os.getuid() == os.geteuid() == 0 and len(sys.argv) == 2
          uid = sys.argv[1]
          assert uid.isascii() and uid.isdecimal() and str(int(uid)) == uid and 0 < int(uid) < 2**32
          assert os.environ.get('SUDO_UID') == uid and pwd.getpwuid(int(uid)).pw_dir == '/home/runner'
          flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          parent = os.open('/', flags)
          try:
              value = os.fstat(parent)
              assert value.st_uid == 0 and not value.st_mode & 0o022
              for component in ('run', 'systemd', 'system', 'user@' + uid + '.service.d'):
                  if component not in ('run', 'systemd'):
                      try:
                          os.mkdir(component, 0o755, dir_fd=parent)
                      except FileExistsError:
                          pass
                  child = os.open(component, flags, dir_fd=parent)
                  os.close(parent)
                  parent = child
                  value = os.fstat(parent)
                  assert value.st_uid == 0 and not value.st_mode & 0o022
              fd = os.open('90-ultrabrain-ci-capabilities.conf',
                           os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o644, dir_fd=parent)
              with os.fdopen(fd, 'wb') as stream:
                  value = os.fstat(stream.fileno())
                  assert stat.S_ISREG(value.st_mode) and value.st_uid == 0 and value.st_nlink == 1
                  stream.write(b'[Service]\nCapabilityBoundingSet=\nAmbientCapabilities=\n')
                  stream.flush()
                  os.fsync(stream.fileno())
              os.fsync(parent)
          finally:
              os.close(parent)
          PY
          sudo /usr/bin/timeout --kill-after=5s 45s /usr/bin/systemctl daemon-reload
          /usr/bin/python3 -I -B - "$fixture_unit" <<'PY'
          import subprocess, sys
          result = subprocess.run(['/usr/bin/systemctl', 'show', sys.argv[1], '--no-pager',
                                   '--property=CapabilityBoundingSet,AmbientCapabilities'],
                                  capture_output=True, text=True, timeout=10)
          assert result.returncode == 0 and sorted(result.stdout.splitlines()) == [
              'AmbientCapabilities=', 'CapabilityBoundingSet=']
          PY
          sudo /usr/bin/timeout --kill-after=5s 45s /usr/bin/loginctl enable-linger "$(/usr/bin/id -un)"
          sudo /usr/bin/timeout --kill-after=5s 45s /usr/bin/systemctl restart "$fixture_unit"
          export XDG_RUNTIME_DIR="/run/user/$fixture_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, subprocess, time
          deadline = time.monotonic() + 35
          for attempt in range(1, 21):
              remaining = deadline - time.monotonic()
              assert remaining > 0, 'Disposable manager registration deadline exceeded'
              result = subprocess.run(['/usr/bin/python3', '-I', '-B', 'test/personal-activate-crash.py',
                                       'diagnose-manager', '--home', os.environ['ULTRABRAIN_HOME']],
                                      capture_output=True, text=True, timeout=remaining)
              assert result.returncode in (0, 1) and len(result.stdout) <= 16384
              value = json.loads(result.stdout)
              assert type(value) is dict and set(value) == {'diagnostic', 'ok', 'exception_chain', 'proc_checks'}
              assert value['diagnostic'] == 'personal_activation_manager'
              print(json.dumps({'fixture_setup_attempt': attempt, **value}, ensure_ascii=True), flush=True)
              if result.returncode == 0:
                  assert value['ok'] is True and value['proc_checks']['manager_capprm_nonzero'] is False
                  break
              chain, proc = value['exception_chain'], value['proc_checks']
              assert value['ok'] is False and len(chain) == 2 \
                  and chain[0]['type'] == 'ActivateManagerError' and chain[0]['safe_code'] == 'manager_unavailable' \
                  and chain[1]['type'] == 'DBusException' and chain[1]['dbus_error'] == 'NameHasNoOwner' \
                  and proc['manager_proc_available'] is False and proc['manager_proc_errno'] is None \
                  and proc['manager_capprm_nonzero'] is None and proc['manager_process_stable'] is None, \
                  'Disposable manager identity failure is not a registration wait'
              remaining = deadline - time.monotonic()
              assert attempt < 20 and remaining > 0, 'Disposable manager registration deadline exceeded'
              time.sleep(min(0.5, remaining))
          PY
      - name: Actual generated user services, restart, consent and periodic model fixture
        run: bun test/personal-services-integration.mjs
      - name: Transactional install, console activation, crash recovery and stopped rollback
        run: bun test/personal-deploy-integration.mjs
      - name: Stop only synthetic service names and database
        if: always()
        run: |
          systemctl --user stop ultrabrain-personal.target ultrabrain-personal-worker.service ultrabrain-personal-console.service ultrabrain-postgres.service || true
          bun src/cli.mjs db stop || true
      # No tokens, private configs, database dumps or raw service journals uploaded.
