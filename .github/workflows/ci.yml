name: Validate ultrabrain
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - run: bash -n scripts/*.sh
  native-integration:
    strategy:
      fail-fast: false
      matrix:
        upgrade_base: [38e0e6657561e17ba85c71d0783d604242a054e8, d7be484b445a893112d3a132c30f42282865a41a, 31f43aa1ff1343bb649e39cf44ca57203ce0ebac, 225fef02de4c3aa33d655c4b2dfde9f246571329, 32f97e8d45b312980ce6ab1784cf316feddd698e, b46c067f0ef110900af7fe8bb2334b4a9c509c3c, fb397f0f3a8ba12253f9e993bba93c387e6de57a, 115978df6069ad11d376f848d214654ba6adde16, f8cc5b980c260cd61e66e032ebce94a5cdc065e3]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ULTRABRAIN_HOME: /home/runner/ultrabrain-test
      ULTRABRAIN_BUILD_JOBS: '2'
      ULTRABRAIN_DEBUG: '1'
      ULTRABRAIN_TEST_ALLOW_WRITE: '1'
      ULTRABRAIN_UPGRADE_BASE: ${{ matrix.upgrade_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev zlib1g-dev pkg-config
      - name: Create private test home before restoring the runtime cache
        run: install -d -m 0700 "$ULTRABRAIN_HOME"
      - uses: actions/cache@v4
        id: pg-cache
        with:
          path: /home/runner/ultrabrain-test/runtime
          key: native-ubuntu24-v1-${{ hashFiles('upstreams.lock.json', 'scripts/build-postgres.sh') }}
      - name: Old-source to candidate upgrade rehearsal with persisted data
        run: bash scripts/test-upgrade.sh
      - name: Versioned native operation contract
        run: bun src/cli.mjs compat
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-regression-${{ github.sha }}-${{ matrix.upgrade_base }}
          path: ${{ runner.temp }}/ultrabrain-upgrade-gate.json
          retention-days: 30
          if-no-files-found: error
      - name: Save successfully built runtime independently of later tests
        if: steps.pg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/ultrabrain-test/runtime
          key: native-ubuntu24-v1-${{ hashFiles('upstreams.lock.json', 'scripts/build-postgres.sh') }}
      - name: Native PostgreSQL, ACL, receipt and MCP wire contract
        run: bun test/integration.mjs && bun test/bound-integration.mjs
      - name: Authenticated Streamable HTTP MCP
        run: bun test/http-integration.mjs
      - name: Durable capture, project concurrency and execution evidence
        run: bun test/reliability-integration.mjs && bun test/revision-evidence-integration.mjs && bun test/deferred-integration.mjs
      - name: Grounded summary cache and source citations (controlled model fixture)
        run: bun test/semantic-integration.mjs
      - name: Resource correction, time validity and current/history separation
        run: bun test/memory-policy-integration.mjs && bun test/review-dependencies-integration.mjs
      - name: Source-bound native facts and lifecycle evidence
        run: bun test/fact-evidence-integration.mjs
      - name: Governed metadata and enterprise admission over two HTTP processes
        run: bun test/response-metadata-integration.mjs && ULTRABRAIN_ENTERPRISE_BENCHMARK_OUTPUT="$RUNNER_TEMP/enterprise-benchmark.json" bun test/enterprise-integration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-read-probe-${{ github.sha }}-${{ matrix.upgrade_base }}
          path: ${{ runner.temp }}/enterprise-benchmark.json
          retention-days: 30
          if-no-files-found: error
      - name: Explicit pgvector SQL upgrade with rollback and crash recovery
        run: python3 test/vector-upgrade-integration.py
      - name: Synthetic keyless retrieval regression (not semantic quality)
        run: ULTRABRAIN_EVAL_OUTPUT="$RUNNER_TEMP/memory-eval.json" bun test/memory-eval.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: memory-eval-${{ github.sha }}-${{ matrix.upgrade_base }}
          path: ${{ runner.temp }}/memory-eval.json
          retention-days: 30
          if-no-files-found: error
      - name: Personal PostgreSQL, authenticated ownership and actual MCP transports
        run: bun test/personal-integration.mjs
      - name: Packaged n8n client against real MCP (context fixture)
        run: |
          ln -s "$GITHUB_WORKSPACE/vendor/gbrain/node_modules" packages/n8n-nodes-ultrabrain/node_modules
          bun scripts/build-n8n.mjs
          bun test/n8n-integration.mjs
      - name: Managed runtime health
        run: bun src/cli.mjs health
      - name: Database backup and isolated restoration
        run: |
          bun src/cli.mjs db backup --destination "$RUNNER_TEMP/ub-backup"
          bun src/cli.mjs db restore-new "$RUNNER_TEMP/ub-backup" --database ub_restore_ci
          python3 test/restore-verify.py ub_restore_ci
      - name: Runtime restart and safe same-major activation
        run: |
          bun src/cli.mjs db stop
          bun src/cli.mjs db activate-runtime
          bun src/cli.mjs db start
          bun src/cli.mjs health
      - name: Verify service unit syntax without enabling a service
        run: |
          python3 scripts/install-service.py --output "$RUNNER_TEMP/ub-units"
          systemd-analyze verify "$RUNNER_TEMP/ub-units/ultrabrain-postgres.service" "$RUNNER_TEMP/ub-units/ultrabrain-mcp.service"
      - name: Privacy-preserving database crash diagnostics
        if: failure()
        run: python3 scripts/pg-diagnostics.py
      - name: Stop private database
        if: always()
        run: bun src/cli.mjs db stop || true
      - name: Export source-only diagnostic fixture
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/ub-fixture/bin"
          cp "$(command -v bun)" "$RUNNER_TEMP/ub-fixture/bin/bun"
          tar --exclude=.git -czf "$RUNNER_TEMP/ub-fixture/gbrain.tgz" -C vendor/gbrain .
          tar -czf "$RUNNER_TEMP/ub-fixture/postgres-runtime.tgz" -C "$ULTRABRAIN_HOME/runtime" .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-runtime-${{ github.sha }}-${{ matrix.upgrade_base }}
          path: ${{ runner.temp }}/ub-fixture/
          retention-days: 3
          if-no-files-found: warn

  n8n-engine:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ULTRABRAIN_HOME: /home/runner/ultrabrain-test
      ULTRABRAIN_TEST_ALLOW_WRITE: '1'
      ULTRABRAIN_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev zlib1g-dev pkg-config
      - run: install -d -m 0700 "$ULTRABRAIN_HOME"
      - uses: actions/cache@v4
        with:
          path: /home/runner/ultrabrain-test/runtime
          key: native-ubuntu24-v1-${{ hashFiles('upstreams.lock.json', 'scripts/build-postgres.sh') }}
      - name: Bootstrap isolated native server
        run: bash scripts/bootstrap-linux.sh
      - name: Build reviewed local node package
        run: bash scripts/package-n8n.sh "$RUNNER_TEMP/n8n-package"
      - name: Install pinned n8n host and this exact local tgz
        run: |
          npm install --prefix "$RUNNER_TEMP/n8n-host" --no-audit --no-fund n8n@2.38.7 n8n-workflow@2.38.1 "$RUNNER_TEMP/n8n-package/n8n-nodes-ultrabrain-0.8.0-alpha.1.tgz"
          ln -s "$RUNNER_TEMP/n8n-host/node_modules" packages/n8n-nodes-ultrabrain/node_modules
      - name: Actual n8n CLI, credential and workflow execution
        env:
          ULTRABRAIN_N8N_BIN: ${{ runner.temp }}/n8n-host/node_modules/n8n/bin/n8n
          ULTRABRAIN_N8N_INSTALLED: ${{ runner.temp }}/n8n-host/node_modules/n8n-nodes-ultrabrain
          ULTRABRAIN_N8N_REPORT: ${{ runner.temp }}/n8n-engine-report.json
        run: bun test/n8n-integration.mjs --engine
      - uses: actions/upload-artifact@v4
        with:
          name: n8n-private-adapter-${{ github.sha }}
          path: |
            ${{ runner.temp }}/n8n-package/*.tgz
            ${{ runner.temp }}/n8n-package/*.sha256
            ${{ runner.temp }}/n8n-engine-report.json
          retention-days: 14
          if-no-files-found: error
      - name: Stop isolated server
        if: always()
        run: bun src/cli.mjs db stop || true
