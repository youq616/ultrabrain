name: Personal source package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tracked-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export only committed source and exact Git identity
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ultrabrain-tracked-source"
          mkdir -m 0700 "$OUT"
          git archive --format=tar HEAD | gzip -n > "$OUT/source.tar.gz"
          git rev-parse HEAD > "$OUT/commit.txt"
          git rev-parse HEAD^{tree} > "$OUT/tree.txt"
          git ls-tree -r --full-tree HEAD > "$OUT/git-tree.txt"
          (cd "$OUT" && sha256sum source.tar.gz commit.txt tree.txt git-tree.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: personal-source-${{ github.sha }}
          path: ${{ runner.temp }}/ultrabrain-tracked-source/
          if-no-files-found: error
          retention-days: 14
      # git archive contains only tracked objects, never runtime config, .git,
      # databases or untracked files. Submodule contents are not vendored here;
      # exact gitlink revisions are retained in git-tree.txt and upstreams.lock.json.
      # This artifact is source identity evidence, not a test or deployment verdict.
